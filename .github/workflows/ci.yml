# CI: tests on the free stub model, then prove both images build. No secrets needed.
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
        env:
          TRIAGE_BACKEND: stub

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t afyaplus-triage:ci .
      - run: docker build -f Dockerfile.agent -t afyaplus-agent:ci .
      - name: Image refuses to start without an injected secret
        run: |
          if docker run --rm afyaplus-triage:ci; then echo "started without JWT_SECRET"; exit 1; fi
      - run: docker images --filter reference='afyaplus-*'
